<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3B7BFF"/>
      <stop offset="1" stop-color="#7A4DF0"/>
    </linearGradient>
    <linearGradient id="hole" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#14183A"/>
      <stop offset="1" stop-color="#232A5C"/>
    </linearGradient>
    <linearGradient id="pin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFE08A"/>
      <stop offset="1" stop-color="#F5B83D"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#0B0F33" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- App tile -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>

  <!-- Socket body -->
  <rect x="222" y="252" width="580" height="520" rx="84" fill="#FFFFFF" filter="url(#shadow)"/>

  <!-- Port opening (RJ45-style stepped cavity) -->
  <path d="M322 352 H702 V610 H622 V672 H402 V610 H322 Z"
        fill="url(#hole)" stroke="url(#hole)" stroke-width="28" stroke-linejoin="round"/>

  <!-- Contact pins -->
  <g fill="url(#pin)">
    <rect x="356" y="352" width="26" height="104" rx="8"/>
    <rect x="410" y="352" width="26" height="104" rx="8"/>
    <rect x="464" y="352" width="26" height="104" rx="8"/>
    <rect x="534" y="352" width="26" height="104" rx="8"/>
    <rect x="588" y="352" width="26" height="104" rx="8"/>
    <rect x="642" y="352" width="26" height="104" rx="8"/>
  </g>

  <!-- Status LED: port is free -->
  <circle cx="740" cy="710" r="26" fill="#2EE59D"/>
  <circle cx="740" cy="710" r="26" fill="none" stroke="#FFFFFF" stroke-opacity="0.9" stroke-width="6"/>
</svg>
